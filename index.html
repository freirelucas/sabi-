  // ===== Estrelas =====
  function ganharEstrela(camadaEl) {
    const id = camadaEl.dataset.camadaId;
    if (!id) return;
    State.pulsoEstrelas[id] = true;
    salvarEstado();
    const estrelaEl = camadaEl.querySelector('.pulso-camada-estrela');
    if (estrelaEl) {
      estrelaEl.classList.add('ganha');
      estrelaEl.textContent = '⭐';
    }
    verificarConfete();
  }

  function verificarConfete() {
    if (confeteJaMostrou) return;
    if (State.pulsoEstrelas.um && State.pulsoEstrelas.dois && State.pulsoEstrelas.quatro) {
      confeteJaMostrou = true;
      mostrarConfete();
    }
  }

  function mostrarConfete() {
    const overlay = el('div', { class: 'pulso-confete-overlay' });
    const cores = ['#C9622E', '#F4D35E', '#6FAE5C', '#5C9CE8', '#E8A45C'];
    for (let i = 0; i < 36; i++) {
      const c = el('div', { class: 'pulso-confete' });
      c.style.left = (Math.random() * 100) + '%';
      c.style.background = cores[i % cores.length];
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      c.style.animationDuration = (1.4 + Math.random() * 0.6) + 's';
      overlay.appendChild(c);
    }
    document.body.appendChild(overlay);
    const medalha = el('div', { class: 'pulso-medalha' }, '🌟 Você sentiu o pulso!');
    document.body.appendChild(medalha);
    setTimeout(() => {
      overlay.parentNode && overlay.remove();
      medalha.parentNode && medalha.remove();
    }, 2800);
  }

  // ===== Constrói uma camada =====
  function fazerCamada({ id, infantil, tecnico, divisao, classe }) {
    const camadaEl = el('div', { class: 'pulso-camada ' + classe });
    camadaEl.dataset.camadaId = id;

    const estrelaEl = el('div',
      { class: 'pulso-camada-estrela' + (State.pulsoEstrelas[id] ? ' ganha' : '') },
      State.pulsoEstrelas[id] ? '⭐' : '☆');

    camadaEl.appendChild(el('div', { class: 'pulso-camada-cabecalho' }, [
      el('div', { class: 'pulso-camada-tit-grupo' }, [
        el('div', { class: 'pulso-camada-tit-infantil' }, infantil.titulo),
        el('div', { class: 'pulso-camada-tit-tecnico' }, tecnico),
      ]),
      estrelaEl,
    ]));

    // Zona clicável pra modo BATER (todo o corpo das barras)
    const zona = el('div', { class: 'pulso-bater-zona', style: 'cursor: default;' });
    const barras = el('div', { class: 'pulso-barras' });
    for (let i = 0; i < divisao; i++) {
      barras.appendChild(el('div',
        { class: 'pulso-divisao', 'data-idx': i },
        [pegada(i, divisao)]
      ));
    }
    zona.appendChild(barras);
    camadaEl.appendChild(zona);

    // Trio de ações
    const acoes = el('div', { class: 'pulso-acoes' });
    const btnVer = el('button', { class: 'pulso-acao', 'aria-label': 'ver sem som' }, '👁 ver');
    const btnOuvir = el('button', { class: 'pulso-acao', 'aria-label': 'ouvir' }, '🔊 ouvir');
    const btnBater = el('button', { class: 'pulso-acao', 'aria-label': 'bater junto' }, '👆 bater');
    btnVer.addEventListener('click', () => tocarCamada(camadaEl, divisao, false));
    btnOuvir.addEventListener('click', () => tocarCamada(camadaEl, divisao, true));
    btnBater.addEventListener('click', () => entrarModoBater(camadaEl, divisao));
    acoes.appendChild(btnVer); acoes.appendChild(btnOuvir); acoes.appendChild(btnBater);
    camadaEl.appendChild(acoes);

    camadas.appendChild(camadaEl);
  }

  // ===== Constrói os pares "dois ao mesmo tempo" =====
  function montarDois() {
    dois.innerHTML = '';
    dois.classList.remove('escondido');
    const cabec = el('div', { class: 'pulso-dois-cabec' }, [
      el('div', { class: 'pulso-dois-titulo' }, 'Dois ao mesmo tempo'),
    ]);
    dois.appendChild(cabec);
    dois.appendChild(el('div', { class: 'pulso-dois-explica' },
      'Escolhe um par pra escutar duas camadas juntas — aí dá pra sentir como uma cabe dentro da outra.'));

    const pares = [
      { a: 1, b: 2, label: '1 batida + 2 batidinhas' },
      { a: 1, b: 4, label: '1 batida + 4 pinguinhos' },
      { a: 2, b: 4, label: '2 batidinhas + 4 pinguinhos' },
    ];
    const wrapPares = el('div', { class: 'pulso-dois-pares' });
    pares.forEach(par => {
      const btn = el('button', { class: 'pulso-dois-par' }, [
        el('span', {}, '🎵'),
        el('span', {}, par.label),
      ]);
      btn.addEventListener('click', () => tocarPar(btn, par.a, par.b));
      wrapPares.appendChild(btn);
    });
    dois.appendChild(wrapPares);
  }

  function tocarPar(btn, divA, divB) {
    Audio.unlock();
    const jaTocando = btn.classList.contains('tocando');
    parar();
    if (jaTocando) return;
    btn.classList.add('tocando');

    const T = calcularTiming(State.bpm);
    const COMPASSOS = 4;
    const totalBeats = COMPASSOS * 4;
    const startTime = Audio.now() + 0.1;
    let cancelado = false;

    function agendarCamada(divisao) {
      const subSec = (T.beat / 1000) / divisao;
      const totalSubs = totalBeats * divisao;
      const vozFn = vozFnPara(divisao);
      for (let i = 0; i < totalSubs; i++) {
        const t = startTime + i * subSec;
        vozFn(t);
      }
    }
    agendarCamada(divA);
    agendarCamada(divB);

    const cleanupCompasso = ativarCompasso(compassoCentral, T.beat, 0, startTime);
    State.reproduzindo = true;
    cleanupAtual = () => {
      cancelado = true;
      try { cleanupCompasso(); } catch(e) {}
      State.reproduzindo = false;
    };
    State.cleanupAtual = cleanupAtual;

    setTimeout(() => {
      if (btn.classList.contains('tocando')) parar();
    }, totalBeats * T.beat + 200);
  }

  // ===== Régua Morse (mantida) =====
  function montarRegua() {
    reguaMorse.innerHTML = '';
    reguaMorse.appendChild(el('div', { class: 'pulso-regua-titulo' }, 'No Morse:'));
    reguaMorse.appendChild(el('div', { class: 'pulso-regua-linha' }, [
      el('div', { class: 'pulso-regua-rotulo' }, '· ponto'),
      el('div', { class: 'pulso-regua-grade' }, [
        el('div', { class: 'pulso-regua-celula preenchida' }),
        el('div', { class: 'pulso-regua-celula' }),
        el('div', { class: 'pulso-regua-celula' }),
        el('div', { class: 'pulso-regua-celula' }),
      ]),
      el('div', { class: 'pulso-regua-explica' }, '1 semicolcheia'),
    ]));
    reguaMorse.appendChild(el('div', { class: 'pulso-regua-linha' }, [
      el('div', { class: 'pulso-regua-rotulo' }, '— traço'),
      el('div', { class: 'pulso-regua-grade' }, [
        el('div', { class: 'pulso-regua-celula preenchida' }),
        el('div', { class: 'pulso-regua-celula preenchida' }),
        el('div', { class: 'pulso-regua-celula preenchida' }),
        el('div', { class: 'pulso-regua-celula' }),
      ]),
      el('div', { class: 'pulso-regua-explica' }, '3 semicolcheias'),
    ]));
  }

  // ===== Seção "Construir MA" =====
  // v8.9: troca de PA pra MA (Lucas).
  //   - M = − −   (2 elementos, 3+1+3 = 7 semicolcheias) cabe na grade de 8
  //   - A = · −   (2 elementos, 1+1+3 = 5 semicolcheias) cabe na grade de 8
  // Vantagens vs PA antigo:
  //   - M cabe inteiro (sem truncar como acontecia com P=·−−·)
  //   - Coerente com PALAVRAS_LETRA (M→Mama) — extensão natural pra MAMA
  //   - "ma" é fonema mais primal pra criança que "pa"
  //   - M é simétrico (−−) — visualmente bonito, ritmicamente regular
  function montarSecaoPA() {
    secaoPA.innerHTML = '';
    secaoPA.appendChild(el('div', { class: 'pulso-pa-cabec' }, [
      el('div', { class: 'pulso-pa-titulo' }, 'Olha o "MA"!'),
      el('div', { class: 'pulso-pa-explica', style: 'font-size:11px;font-style:italic;color:var(--tinta-suave);flex:1;text-align:right' },
        '· e − feitos de pulso'),
    ]));

    function fazerLinha(letra, padrao) {
      // padrao = array com 'ponto' (1 cell), 'traco-N' (3 cells em sequência),
      // 'vazio' (espaço entre elementos). Total preenche 8 cells.
      const grade = el('div', { class: 'pulso-pa-letra-grade' });
      const cells = [];
      padrao.forEach((cls) => {
        const c = el('div', { class: 'pulso-pa-cel ' + cls });
        grade.appendChild(c);
        cells.push(c);
      });
      const linha = el('div', { class: 'pulso-pa-letra' }, [
        el('div', { class: 'pulso-pa-letra-simbolo' }, letra),
        grade,
      ]);
      return { linha, cells };
    }

    // M = − − : traço (3) + esp (1) + traço (3) + vazio (1) = 8
    const m = fazerLinha('M', [
      'traco-1','traco-2','traco-3',
      'vazio',
      'traco-1','traco-2','traco-3',
      'vazio',
    ]);
    // A = · − : ponto (1) + esp (1) + traço (3) + vazio (3) = 8
    const a = fazerLinha('A', [
      'ponto',
      'vazio',
      'traco-1','traco-2','traco-3',
      'vazio','vazio','vazio',
    ]);
    secaoPA.appendChild(m.linha);
    secaoPA.appendChild(a.linha);

    const btnPA = el('button', { class: 'pulso-acao', style: 'margin-top:6px' }, '🔊 ouvir M + A');
    btnPA.addEventListener('click', () => tocarPA(m.cells, a.cells));
    secaoPA.appendChild(btnPA);
  }

  function tocarPA(cellsM, cellsA) {
    Audio.unlock();
    parar();
    const T = calcularTiming(State.bpm);
    const subSec = (T.beat / 1000) / 4; // semicolcheia = 1 célula
    const startTime = Audio.now() + 0.1;
    let acumulado = 0;

    function agendarLetra(cells, padrao) {
      // Toca · ou − conforme padrão; cada célula = 1 semicolcheia
      const elementos = []; // [{type:'ponto'|'traco', durSubs:1|3}, 'esp']
      let i = 0;
      while (i < padrao.length) {
        const p = padrao[i];
        if (p === 'ponto') { elementos.push({ type: '.', durSubs: 1 }); i++; }
        else if (p && p.startsWith('traco')) {
          // pula próximas 'traco-2','traco-3' do mesmo grupo
          let durSubs = 0;
          while (i < padrao.length && padrao[i] && padrao[i].startsWith('traco')) {
            durSubs++; i++;
          }
          elementos.push({ type: '-', durSubs });
        }
        else { elementos.push({ type: 'esp', durSubs: 1 }); i++; }
      }
      let idxCell = 0;
      elementos.forEach(e => {
        if (e.type === '.' || e.type === '-') {
          const t = startTime + acumulado * subSec;
          const dur = e.durSubs * subSec * 1000;
          Audio.playElemento(e.type, State.vozPulso, t, dur);
          // Anima as cells correspondentes
          for (let k = 0; k < e.durSubs; k++) {
            const cell = cells[idxCell + k];
            if (cell) {
              const tCell = startTime + (acumulado + k) * subSec;
              Audio.scheduleVisual(tCell, () => {
                cell.classList.add('ativo');
                setTimeout(() => cell.classList.remove('ativo'), subSec * 1000 + 80);
              });
            }
          }
        }
        acumulado += e.durSubs;
        idxCell += e.durSubs;
      });
    }

    // v8.9: padrões devem bater com os do montarSecaoPA (M e A)
    const padraoM = ['traco-1','traco-2','traco-3','vazio','traco-1','traco-2','traco-3','vazio'];
    const padraoA = ['ponto','vazio','traco-1','traco-2','traco-3','vazio','vazio','vazio'];
    agendarLetra(cellsM, padraoM);
    // Espaço entre letras (M e A): 2 semicolcheias adicionais (já temos 1
    // 'vazio' no fim do padraoM, total 3 semicolcheias = espaço de letra Morse)
    acumulado += 2;
    agendarLetra(cellsA, padraoA);

    const cleanupCompasso = ativarCompasso(compassoCentral, T.beat, 0, startTime);
    cleanupAtual = () => { try { cleanupCompasso(); } catch(e) {} };
    State.cleanupAtual = cleanupAtual;
    State.reproduzindo = true;

    setTimeout(() => parar(), acumulado * subSec * 1000 + 400);
  }

  // ===== Render principal =====
  function redesenharCamadas() {
    camadas.innerHTML = '';
    fazerCamada({
      id: 'um',
      infantil: { titulo: '1 batida grande' },
      tecnico: 'semínima · 1 pulso',
      divisao: 1,
      classe: 'um',
    });
    fazerCamada({
      id: 'dois',
      infantil: { titulo: '2 batidinhas' },
      tecnico: 'colcheias · pulso ÷ 2',
      divisao: 2,
      classe: 'dois',
    });
    fazerCamada({
      id: 'quatro',
      infantil: { titulo: '4 pinguinhos' },
      tecnico: 'semicolcheias · pulso ÷ 4',
      divisao: 4,
      classe: 'quatro',
    });
    montarRegua();
    montarDois();
    montarSecaoPA();
  }
  redesenharCamadas();

  // Bumbo audível default ON nesta tela (sai quando voltar)
  const bumboOriginal = State.bumboAudivel;
  State.bumboAudivel = true;
  // Restaura ao sair da tela (interceptamos via observer no compassoCentral
  // — quando o elemento sai do DOM, restauramos)
  const obs = new MutationObserver(() => {
    if (!document.contains(compassoCentral)) {
      State.bumboAudivel = bumboOriginal;
      obs.disconnect();
    }
  });
  obs.observe(document.body, { childList: true, subtree: true });

  tela.appendChild(wrap);
}

/* ============================================================
   CENA — render de uma cena da história
   ============================================================ */
function renderCena(tela, cena) {
  const wrap = el('div', { class: 'cena' });

  // v8 (Temporada 1): cabeçalho "Ep N/11 · 🏠 em casa · Título". Bloco é
  // opcional pra cenas legadas; cenas sem `bloco` mostram só "Ep N/N".
  const totalCenas = ROTEIRO.length;
  const epNum = State.cenaIdx + 1;
  const bloco = cena.bloco;
  const cabHTML = [
    el('span', { class: 'cena-ep' }, `Ep ${epNum}/${totalCenas}`),
    bloco ? el('span', { class: 'cena-bloco' }, `${bloco.emoji} ${bloco.nome}`) : null,
    el('span', { class: 'cena-titulo-mini' }, cena.titulo),
  ].filter(Boolean);
  wrap.appendChild(el('div', { class: 'cena-cabecalho' }, cabHTML));

  // Fundo + personagens — só renderiza se houver personagens. Cenas com palco vazio
  // (ex.: roda de apresentação que monta o próprio círculo) não desperdiçam espaço.
  if (cena.personagens && cena.personagens.length > 0) {
    const fundo = el('div', { class: 'cena-fundo ' + cena.fundo });
    if (cena.decoracao === 'sol') fundo.appendChild(el('div', { class: 'cena-sol' }));
    if (cena.decoracao === 'nuvem') fundo.appendChild(el('div', { class: 'cena-nuvem' }, '☁️'));
    if (cena.decoracao === 'bola-pingpong') fundo.appendChild(el('div', { class: 'cena-deco-emoji' }, '🏓'));
    if (cena.decoracao === 'xadrez') fundo.appendChild(el('div', { class: 'cena-deco-emoji' }, '♟'));
    if (cena.decoracao === 'bola') fundo.appendChild(el('div', { class: 'cena-deco-emoji' }, '⚽'));
    if (cena.decoracao === 'flor-ipe') fundo.appendChild(el('div', { class: 'cena-deco-emoji' }, '🌸'));
    fundo.appendChild(el('div', { class: 'cena-galho' }));

    const palco = el('div', { class: 'cena-palco' });
    cena.personagens.forEach(p => {
      const svg = passaroSVG(p.tipo);
      if (p.classe) svg.classList.add(p.classe);
      palco.appendChild(svg);
    });
    fundo.appendChild(palco);
    wrap.appendChild(fundo);
  }

  // Fala principal
  const fala = el('div', {
    class: 'cena-fala maior',
    'aria-live': 'polite',
    html: cena.fala,
  });
  wrap.appendChild(fala);

  if (cena.falaSub) {
    wrap.appendChild(el('div', {
      class: 'cena-fala',
      style: 'font-style:italic; color: var(--tinta-suave); background: transparent; border: none; box-shadow: none; padding: 4px 12px;',
      html: cena.falaSub,
    }));
  }

  // Ação interativa
  const conteudoAcao = el('div', { style: 'margin: 8px 0;' });
  renderAcaoCena(conteudoAcao, cena);
  wrap.appendChild(conteudoAcao);

  // Navegação
  const acoes = el('div', { class: 'cena-acoes' });
  if (State.cenaIdx > 0) {
    acoes.appendChild(el('button', {
      class: 'botao secundario pequeno',
      onClick: () => navegar('historia', { cenaIdx: State.cenaIdx - 1 })
    }, '← anterior'));
  }
  acoes.appendChild(el('button', {
    class: 'botao laranja',
    onClick: () => {
      State.cumpridas.add('cena-' + State.cenaIdx); salvarEstado();
      // v9.0: trinado curto de transição — sensação de "página virada".
      // Tom alto rápido (G5) seguido de tom mais alto (B5) sintetizados pelo
      // sabiá. Não atrapalha o fluxo (~150ms), só dá o feedback de avanço.
      Audio.unlock();
      try {
        const t = Audio.now();
        Audio.playSabiaTom(t, 79, 0.08, 0.35);        // G5
        Audio.playSabiaTom(t + 0.09, 83, 0.10, 0.35); // B5
      } catch(e) {}
      if (State.cenaIdx < ROTEIRO.length - 1) {
        navegar('historia', { cenaIdx: State.cenaIdx + 1 });
      } else {
        // Final: volta pra landing (a história termina em si mesma).
        celebrar(40);
        setTimeout(() => navegar('landing'), 1800);
      }
    }
  }, cena.proximo));
  wrap.appendChild(acoes);

  tela.appendChild(wrap);

  // Auto-tocar canto na cena de abertura
  if (cena.id === 'amanhecer') {
    setTimeout(() => { Audio.unlock(); Audio.playCantoSabiaFloreio(); }, 600);
  }
}

function renderAcaoCena(container, cena) {
  const a = cena.acao;
  if (!a) return;
  if (a.tipo === 'familia-apresentacao') {
    // v8 E1/E2: cena Em casa / Os paios e maios. N nomes (4 ou 2) + N combos
    // afetivos (PAPA-TO etc). Cada nome individual mostra balão de fala + botão
    // pra tocar Morse com decomposição. Combos tocam sequência das 2 palavras
    // separadas por espaço de palavra. Reusa criarDecomposicaoNome.
    const nomes = a.nomes || [];
    const combos = a.combos || [];

    const balcao = el('div', { class: 'familia-balcao' });
    container.appendChild(balcao);

    const painel = el('div', { class: 'decomp-painel escondido' });
    container.appendChild(painel);

    let decompAtual = null;
    function mostrar(palavra, label) {
      if (decompAtual) decompAtual.parar();
      painel.innerHTML = '';
      painel.classList.remove('escondido');
      painel.appendChild(el('div', { class: 'decomp-titulo' }, [
        el('b', {}, label),
        el('span', { style: 'opacity:0.7' }, ' em código'),
      ]));
      decompAtual = criarDecomposicaoNome(palavra, 'sabia');
      painel.appendChild(decompAtual.wrap);
      // v9.3: sem autoplay — criança aperta "ouvir" no painel decomp.
    }

    nomes.forEach(n => {
      const balao = el('button', {
        class: 'familia-balao',
        'aria-label': `tocar ${n.label}`,
        onClick: () => mostrar(n.palavra, n.label),
      }, [
        el('span', { class: 'familia-balao-emoji' }, '💬'),
        el('span', { class: 'familia-balao-nome' }, n.label),
      ]);
      balcao.appendChild(balao);
    });

    if (combos.length) {
      const linha = el('div', { class: 'familia-combos' });
      linha.appendChild(el('div', { class: 'familia-combos-titulo' }, '— juntos —'));
      const chips = el('div', { class: 'familia-combos-chips' });
      combos.forEach(c => {
        chips.appendChild(el('button', {
          class: 'chip-combo',
          onClick: () => mostrar(c.texto, c.label),
        }, c.label));
      });
      linha.appendChild(chips);
      container.appendChild(linha);
    }
  } else if (a.tipo === 'tete-padrao') {
    // v8.1 E5: TETE em padrão alternado – · – ·. Cena pedagógica que destaca
    // que esse é o nome mais fácil do Morse: só dois símbolos básicos
    // alternando 4 vezes. Quatro botões grandes em sequência, depois uma
    // chamada pra tocar o nome inteiro. Cores Sol/Ré já estabelecidas
    // (amarelo/violeta) reforçam · = curto, – = longo.
    const elementos = [
      { letra: 'T', simbolo: '–', cls: 'traco', tom: '-' },
      { letra: 'E', simbolo: '·', cls: 'ponto', tom: '.' },
      { letra: 'T', simbolo: '–', cls: 'traco', tom: '-' },
      { letra: 'E', simbolo: '·', cls: 'ponto', tom: '.' },
    ];

    const tabuleiro = el('div', { class: 'tete-padrao' });
    elementos.forEach((e, i) => {
      const card = el('button', {
        class: 'tete-card ' + e.cls,
        'aria-label': `letra ${e.letra}, ${e.cls === 'ponto' ? 'curto' : 'longo'}`,
        onClick: () => {
          Audio.unlock();
          Audio.playElemento(e.tom, 'sabia');
          card.classList.remove('pulsar');
          void card.offsetWidth;
          card.classList.add('pulsar');
        },
      }, [
        el('span', { class: 'tete-card-letra' }, e.letra),
        el('span', { class: 'tete-card-simbolo' }, e.simbolo),
      ]);
      tabuleiro.appendChild(card);
    });
    container.appendChild(tabuleiro);

    container.appendChild(el('div', { class: 'tete-legenda' },
      'cada letra = um som. juntas formam — · — ·'));

    const acoesTete = el('div', { class: 'dupla-acoes' });
    acoesTete.appendChild(el('button', {
      class: 'botao laranja grande',
      onClick: () => {
        Audio.unlock();
        const cards = tabuleiro.querySelectorAll('.tete-card');
        const seq = palavraParaMorse('TETE');
        let i = 0;
        tocarSequencia(seq, {
          voz: 'sabia',
          repeticoes: 1,
          onElemento: (sim) => {
            if (sim === '.' || sim === '-') {
              const card = cards[i++];
              if (card) {
                card.classList.remove('pulsar');
                void card.offsetWidth;
                card.classList.add('pulsar');
              }
            }
          },
        });
      },
    }, '🎵 tocar TETE inteira'));
    container.appendChild(acoesTete);
  } else if (a.tipo === 'cena-curta') {
    // v8 E3: caminho pra escola. Cena de transição leve, sem componente
    // interativo. A fala + botão "próximo" da renderCena já bastam — o
    // renderer só adiciona um pequeno indicador visual (pegadas).
    container.appendChild(el('div', { class: 'cena-curta-deco' }, '🐾   🐾   🐾'));
  } else if (a.tipo === 'coleguinha-solo') {
    // v9.2: apresentação INDIVIDUAL de um coleguinha — antes do time.
    // Sabiá grande + nome + Morse animado. Botão ouvir (loop, com pause).
    // Botões · / − pra brincar. Seletor 3-velocidades.
    const item = a.coleguinha;  // { quem, nome }
    const morseNome = palavraParaMorse(item.nome.toUpperCase());

    const wrapSolo = el('div', { class: 'solo-wrap' });

    // Sabiá grande
    const sabiaGrande = el('div', { class: 'solo-sabia-wrap' });
    const svg = passaroSVG(item.quem);
    if (svg) {
      svg.style.width = '120px'; svg.style.height = '120px';
      svg.style.transform = 'scale(1)';
      sabiaGrande.appendChild(svg);
    }
    wrapSolo.appendChild(sabiaGrande);

    // Nome grande
    wrapSolo.appendChild(el('div', { class: 'solo-nome' }, item.nome.toUpperCase()));

    // Morse animado
    const morseBox = el('div', { class: 'morse-display solo-morse', html: renderMorse(morseNome) });
    wrapSolo.appendChild(morseBox);

    // Compasso
    const compassoSolo = criarCompasso('solo');
    wrapSolo.appendChild(compassoSolo);

    // Seletor 3-velocidades
    wrapSolo.appendChild(criarSeletorVelocidadeReduzido());

    // Botão grande TOGGLE (pause sempre funciona)
    const btnSolo = el('button', { class: 'botao laranja grande' }, '🔁 ouvir ' + item.nome);
    let tocandoSolo = false;
    function pararSolo() {
      pararLoop();
      tocandoSolo = false;
      btnSolo.textContent = '🔁 ouvir ' + item.nome;
      morseBox.querySelectorAll('.ponto, .traco').forEach(e => e.classList.remove('ativo'));
    }
    btnSolo.addEventListener('click', () => {
      Audio.unlock();
      if (tocandoSolo) { pararSolo(); return; }
      tocandoSolo = true;
      btnSolo.textContent = '⏸ parar';
      const els = morseBox.querySelectorAll('.ponto, .traco');
      tocarSequencia(morseNome, {
        voz: 'sabia',
        compasso: compassoSolo,
        infinito: true,
        onElemento: (ch, i) => {
          els.forEach(e => e.classList.remove('ativo'));
          if (els[i]) {
            els[i].classList.add('ativo');
            setTimeout(() => els[i] && els[i].classList.remove('ativo'),
              ch === '.' ? 120 : 320);
          }
        },
      });
    });
    wrapSolo.appendChild(btnSolo);

    // Mini-teclado · / − pra brincar
    const par = el('div', { class: 'sos-brincar-botoes' });
    par.appendChild(el('button', {
      class: 'botao-tom-ponto',
      'aria-label': 'tocar ponto',
      onClick: () => {
        Audio.unlock();
        Audio.playElemento('.', 'sabia', Audio.now() + 0.02,
          calcularTiming(State.bpm).ponto);
      },
    }, ['·']));
    par.appendChild(el('button', {
      class: 'botao-tom-traco',
      'aria-label': 'tocar traço',
      onClick: () => {
        Audio.unlock();
        Audio.playElemento('-', 'sabia', Audio.now() + 0.02,
          calcularTiming(State.bpm).traco);
      },
    }, ['–']));
    wrapSolo.appendChild(par);

    container.appendChild(wrapSolo);
  } else if (a.tipo === 'dupla-coop') {
    // v8 E5/E6: dupla cooperativa (altinha/frescobol). 2 personagens lado a
    // lado, bolinha visual entre eles. Botão "rebater" alterna o "lado ativo"
    // e toca o nome de quem recebe. Botão "jogar junto" toca os 2 em sequência
    // várias vezes. Contador de rebatidas como reforço positivo cooperativo.
    const dupla = a.dupla;  // [{ quem, nome }, { quem, nome }]
    const simbolo = a.simbolo || '⚽';
    let lado = 0;       // 0 = primeiro recebe; 1 = segundo recebe
    let contador = 0;

    const palco = el('div', { class: 'dupla-palco ' + (a.esporte || '') });
    const slots = dupla.map((p, i) => {
      const slot = el('button', {
        class: 'dupla-slot' + (i === lado ? ' ativo' : ''),
        'aria-label': `quem recebe: ${p.nome}`,
        onClick: () => rebater(),
      });
      const svg = passaroSVG(p.quem);
      if (svg) { svg.style.width = '70px'; svg.style.height = '70px'; slot.appendChild(svg); }
      slot.appendChild(el('div', { class: 'dupla-slot-nome' }, p.nome));
      return slot;
    });
    const bolinha = el('div', { class: 'dupla-bolinha' }, simbolo);

    palco.appendChild(slots[0]);
    palco.appendChild(bolinha);
    palco.appendChild(slots[1]);
    container.appendChild(palco);

    const placar = el('div', { class: 'dupla-placar', 'aria-live': 'polite' },
      `rebatidas: 0 — joga junto, sem ganhador!`);
    container.appendChild(placar);

    function rebater() {
      const recebe = dupla[lado];
      slots.forEach((s, i) => s.classList.toggle('ativo', i === lado));
      bolinha.classList.remove('voar-esq', 'voar-dir');
      void bolinha.offsetWidth;  // força reflow pra reaplicar animação
      bolinha.classList.add(lado === 0 ? 'voar-esq' : 'voar-dir');
      tocarSequencia(palavraParaMorse(recebe.nome.toUpperCase()), { voz: 'sabia', repeticoes: 1 });
      contador++;
      placar.textContent = `rebatidas: ${contador} — joga junto, sem ganhador!`;
      lado = 1 - lado;
    }

    const acoesCoop = el('div', { class: 'dupla-acoes' });
    acoesCoop.appendChild(el('button', {
      class: 'botao laranja',
      onClick: rebater,
    }, '🏐 rebater'));
    acoesCoop.appendChild(el('button', {
      class: 'botao secundario',
      onClick: () => {
        const palavra = (a.palavra || '').toUpperCase();
        if (!palavra) return;
        tocarSequencia(palavraParaMorse(palavra), { voz: 'sabia', repeticoes: 1 });
      },
    }, '📣 tocar "' + (a.palavra || '').toLowerCase() + '"'));
    container.appendChild(acoesCoop);
  } else if (a.tipo === 'aprender-toques') {
    // E1: lógica geral dos toques. Compasso + display que acumula + botões
    // grandes · e –. Mesmo molde do antigo curto-longo, mas com falas da Nena
    // pra criança entender que tudo no Morse é só esses dois sons.
    const compasso = criarCompasso('pulso');
    container.appendChild(compasso);
    let T = calcularTiming(State.bpm);
    State.cleanupAtual = ativarCompasso(compasso, T.beat);

    // Seletor de velocidade: re-ativa o compasso no novo BPM
    container.appendChild(criarSeletorVelocidade((novoBpm) => {
      T = calcularTiming(novoBpm);
      State.cleanupAtual = ativarCompasso(compasso, T.beat);
    }));

    container.appendChild(el('div', {
      style: 'text-align:center; font-family:var(--display); font-style:italic; color:var(--marrom-claro); font-size:14px; margin:4px 0;'
    }, 'aperta os botões pra brincar com curto e longo'));

    const dispEl = el('div', { class: 'morse-display', style: 'font-size:48px; min-height:60px;' });
    container.appendChild(dispEl);

    // v7: cada botão tem o símbolo + legenda da corda (Sol/Ré). Lucas pediu
    // "sempre as notas ré e sol soltas da guitarra como referência". Toque
    // dispara sabiá + corda paralela (vol baixo) pra Bento associar · = Sol.
    const fileira = el('div', { style: 'display:flex; gap:18px; justify-content:center; margin: 8px 0;' });
    fileira.appendChild(el('button', {
      class: 'botao-grande-icone amarelo com-legenda',
      'aria-label': 'tocar um ponto curto, corda Sol',
      onClick: () => {
        Audio.unlock();
        Audio.playElemento('.', 'sabia', undefined, T.ponto);
        Audio.playReferenciaCorda('.', undefined, T.ponto);
        const s = el('span', { class: 'ponto', html: State.notacaoBinaria ? '0' : '·' });
        s.style.fontSize = '40px'; s.style.color = 'var(--sol-violao)';
        dispEl.appendChild(s);
        if (dispEl.children.length > 12) dispEl.firstChild.remove();
      }
    }, [
      el('span', { class: 'sinal' }, State.notacaoBinaria ? '0' : '·'),
      el('span', { class: 'legenda-corda' }, 'Sol'),
    ]));
    fileira.appendChild(el('button', {
      class: 'botao-grande-icone com-legenda',
      style: 'background: var(--re-violao); width:120px; border-radius:40px;',
      'aria-label': 'tocar um traço longo, corda Ré',
      onClick: () => {
        Audio.unlock();
        Audio.playElemento('-', 'sabia', undefined, T.traco);
        Audio.playReferenciaCorda('-', undefined, T.traco);
        const s = el('span', { class: 'traco', html: State.notacaoBinaria ? '1' : '–' });
        s.style.fontSize = '48px'; s.style.color = 'var(--re-violao)';
        dispEl.appendChild(s);
        if (dispEl.children.length > 12) dispEl.firstChild.remove();
      }
    }, [
      el('span', { class: 'sinal' }, State.notacaoBinaria ? '1' : '–'),
      el('span', { class: 'legenda-corda' }, 'Ré'),
    ]));
    container.appendChild(fileira);
  } else if (a.tipo === 'time-apresentacao') {
    // E2/E3 v6: Lucas pediu decomposição completa. Quando clica em quem está
    // com a setinha, mostra o nome decomposto em letras (com Morse abaixo) +
    // botão de loop + cliques individuais + highlight. Mantém o conceito de
    // sequência guiada (não pula direto pra próximo até criança brincar).
    const seq = a.sequencia;
    const eXadrez = a.time === 'xadrez';
    let idx = 0;
    const falados = new Set();
    let decompAtual = null;

    const linha = el('div', { class: 'time-fileira' + (eXadrez ? ' xadrez' : ' pingpong') });
    container.appendChild(linha);

    const status = el('div', { class: 'roda-status', 'aria-live': 'polite' });
    container.appendChild(status);

    // Painel da decomposição — preenchido quando a criança escolhe alguém
    const painel = el('div', { class: 'decomp-painel escondido' });
    container.appendChild(painel);

    function render() {
      linha.innerHTML = '';
      seq.forEach((item) => {
        const ehAtivo = idx < seq.length && seq[idx].quem === item.quem;
        const ehFalado = falados.has(item.quem);
        const slot = el('button', {
          class: 'time-slot' + (ehFalado ? ' falou' : '') + (ehAtivo ? ' ativo' : ''),
          'aria-label': ehFalado ? `${item.nome} já falou` : (ehAtivo ? `escolher ${item.nome}` : `aguarde ${item.nome}`),
          ...(!ehAtivo && !ehFalado ? { disabled: 'true' } : {}),
          onClick: () => escolher(item),
        });
        const svg = passaroSVG(item.quem);
        if (svg) { svg.style.width = '64px'; svg.style.height = '64px'; svg.style.transform = 'scale(1)'; slot.appendChild(svg); }
        slot.appendChild(el('div', { class: 'time-slot-nome' }, item.nome));
        linha.appendChild(slot);
      });
    }
    function atualizaStatus() {
      if (idx >= seq.length) {
        status.innerHTML = eXadrez
          ? '♟ <b>turma do xadrez completa!</b>'
          : '🏓 <b>turma do ping-pong completa!</b>';
        return;
      }
      const proximo = seq[idx];
      status.innerHTML = (eXadrez ? '♟' : '🏓') + ` escolhe <b>${proximo.nome}</b>`;
    }
    function escolher(item) {
      if (idx >= seq.length || seq[idx].quem !== item.quem) return;
      if (falados.has(item.quem)) return;
      falados.add(item.quem);
      idx++;

      // Limpa decomposição anterior (se houver) e mostra a nova
      if (decompAtual) decompAtual.parar();
      painel.innerHTML = '';
      painel.classList.remove('escondido');

      const titulo = el('div', { class: 'decomp-titulo' }, [
        el('span', {}, eXadrez ? '♟ ' : '🏓 '),
        el('b', {}, item.nome),
        el('span', { style: 'opacity:0.7' }, ' em código'),
      ]);
      painel.appendChild(titulo);

      decompAtual = criarDecomposicaoNome(item.nome, 'sabia');
      painel.appendChild(decompAtual.wrap);
      // v9.3: sem autoplay — criança escolhe quando ouvir.

      atualizaStatus();
      render();
    }

    render();
    atualizaStatus();
  } else if (a.tipo === 'recap-nomes') {
    // E4 v6: clica em quem da turma → mostra decomposição completa do nome
    // (letras visíveis + Morse + loop default + cliques individuais).
    const lista = a.nomes;
    let decompAtual = null;

    const grade = el('div', { class: 'recap-grade' });
    container.appendChild(grade);

    const painel = el('div', { class: 'decomp-painel escondido' });
    container.appendChild(painel);

    function escolher(item, cell) {
      if (decompAtual) decompAtual.parar();
      painel.innerHTML = '';
      painel.classList.remove('escondido');

      // Marca quem está sendo ouvido na grade
      grade.querySelectorAll('.recap-item').forEach(c => c.classList.remove('ativo'));
      cell.classList.add('ativo');

      painel.appendChild(el('div', { class: 'decomp-titulo' }, [
        el('span', {}, '⚽ '),
        el('b', {}, item.nome),
        el('span', { style: 'opacity:0.7' }, ' em código'),
      ]));

      decompAtual = criarDecomposicaoNome(item.nome, 'sabia');
      painel.appendChild(decompAtual.wrap);
      // v9.3: sem autoplay.
    }

    lista.forEach((item) => {
      const cell = el('button', {
        class: 'recap-item',
        'aria-label': `decompor ${item.nome}`,
      });
      cell.addEventListener('click', () => escolher(item, cell));
      const svg = passaroSVG(item.quem);
      if (svg) { svg.style.width = '52px'; svg.style.height = '52px'; svg.style.transform = 'scale(1)'; cell.appendChild(svg); }
      cell.appendChild(el('div', { class: 'recap-nome' }, item.nome));
      grade.appendChild(cell);
    });
  } else if (a.tipo === 'aula-sos') {
    // v9.2: renderer SOS recriado (foi deletado por engano em v9.0 F1).
    // 3 grupos visuais (· · · / − − − / · · ·), botão "ouvir SOS" toggle,
    // e mini-teclado · / − pra criança brincar livremente.
    const sosWrap = el('div', { class: 'sos-wrap' });

    // 3 grupos
    const seqSOS = '... --- ...';
    const grupos = [
      { letra: 'S', morse: '...' },
      { letra: 'O', morse: '---' },
      { letra: 'S', morse: '...' },
    ];
    const display = el('div', { class: 'sos-display' });
    const allEls = [];   // lista plana de spans dos elementos pra animar
    grupos.forEach(g => {
      const grupo = el('div', { class: 'sos-grupo', 'aria-label': g.letra }, []);
      g.morse.split('').forEach(ch => {
        const sp = el('span', { class: ch === '.' ? 'ponto' : 'traco' },
          ch === '.' ? '·' : '–');
        grupo.appendChild(sp);
        allEls.push(sp);
      });
      display.appendChild(grupo);
    });
    sosWrap.appendChild(display);

    // Compasso pulsando
    const compassoSOS = criarCompasso('aula-sos');
    sosWrap.appendChild(compassoSOS);

    // Seletor de velocidade (3 níveis pra cenas com áudio)
    sosWrap.appendChild(criarSeletorVelocidadeReduzido(() => {
      // re-render seria caro; só atualiza no próximo play
    }));

    // Botão grande TOGGLE pra ouvir SOS — pause sempre funciona
    const btnSOS = el('button', { class: 'botao laranja grande', 'aria-label': 'ouvir SOS' }, '🔊 ouvir SOS');
    let tocandoSOS = false;
    function pararSOS() {
      pararLoop();
      tocandoSOS = false;
      btnSOS.textContent = '🔊 ouvir SOS';
      allEls.forEach(e => e.classList.remove('ativo'));
    }
    btnSOS.addEventListener('click', () => {
      Audio.unlock();
      if (tocandoSOS) { pararSOS(); return; }
      tocandoSOS = true;
      btnSOS.textContent = '⏸ parar';
      tocarSequencia(seqSOS, {
        voz: 'sabia',
        compasso: compassoSOS,
        onElemento: (ch, i) => {
          allEls.forEach(e => e.classList.remove('ativo'));
          if (allEls[i]) {
            allEls[i].classList.add('ativo');
            setTimeout(() => allEls[i] && allEls[i].classList.remove('ativo'),
              ch === '.' ? 120 : 320);
          }
        },
        onFim: () => { tocandoSOS = false; btnSOS.textContent = '🔊 ouvir SOS'; },
      });
    });
    sosWrap.appendChild(btnSOS);

    // Mini-teclado · / − pra brincar (dinâmicas de ponto e traço)
    const brincar = el('div', { class: 'sos-brincar' });
    brincar.appendChild(el('div', { class: 'sos-brincar-rotulo' },
      'ou brinca: aperta os botões livremente'));
    const par = el('div', { class: 'sos-brincar-botoes' });
    par.appendChild(el('button', {
      class: 'botao-tom-ponto',
      'aria-label': 'tocar ponto',
      onClick: () => {
        Audio.unlock();
        Audio.playElemento('.', 'sabia', Audio.now() + 0.02,
          calcularTiming(State.bpm).ponto);
      },
    }, ['·']));
    par.appendChild(el('button', {
      class: 'botao-tom-traco',
      'aria-label': 'tocar traço',
      onClick: () => {
        Audio.unlock();
        Audio.playElemento('-', 'sabia', Audio.now() + 0.02,
          calcularTiming(State.bpm).traco);
      },
    }, ['–']));
    brincar.appendChild(par);
    sosWrap.appendChild(brincar);

    container.appendChild(sosWrap);
  } else if (a.tipo === 'letras-parabens') {
    // v8.3: novo final da Temporada 1. Cada coleguinha traz 1-2 letras de
    // PARABENS NENA. À medida que entregam, a frase aparece no topo,
    // os símbolos Morse correspondentes preenchem embaixo, e o ritmo é
    // mostrado pelo compasso. Quando todos entregaram, Nena chega
    // (sem overlay fullscreen — Lucas: "final perde botão de voltar").
    // Bolo + confete + canto da turma. Botão "voltar pro início" do
    // renderCena fica sempre visível.
    const FRASE = 'PARABENS NENA';   // 12 letras + 1 espaço (separa palavra)
    // Distribuição: 8 coleguinhas entregam 1-2 letras na ordem da frase.
    const turmaLetras = [
      { quem: 'caca', nome: 'Caca', letras: 'PA' },   // PA
      { quem: 'jo',   nome: 'Jo',   letras: 'RA' },   // RA
      { quem: 'tete', nome: 'Tete', letras: 'BE' },   // BE
      { quem: 'tata', nome: 'Tata', letras: 'NS' },   // NS
      { quem: 'tito', nome: 'Tito', letras: 'N'  },   // N
      { quem: 'lila', nome: 'Lila', letras: 'E'  },   // E
      { quem: 'to',   nome: 'To',   letras: 'N'  },   // N
      { quem: 'ben',  nome: 'Ben',  letras: 'A'  },   // A
    ];

    let entreguesIdx = 0;        // próximo da turma a entregar
    const letrasReveladas = new Set();   // posições da frase já reveladas

    // ---- Topo: frase incremental ----
    const fraseTopo = el('div', { class: 'letras-frase' });
    function renderFrase() {
      fraseTopo.innerHTML = '';
      let pos = 0;
      for (let i = 0; i < FRASE.length; i++) {
        const ch = FRASE[i];
        if (ch === ' ') {
          fraseTopo.appendChild(el('span', { class: 'letras-frase-espaco' }, ' '));
          continue;
        }
        const revelada = letrasReveladas.has(pos);
        fraseTopo.appendChild(el('span', {
          class: 'letras-frase-letra' + (revelada ? ' revelada' : ''),
          'data-pos': String(pos),
        }, revelada ? ch : '_'));
        pos++;
      }
    }
    container.appendChild(fraseTopo);

    // ---- Símbolos Morse alinhados embaixo ----
    const morseTopo = el('div', { class: 'letras-morse' });
    function renderMorseFrase() {
      morseTopo.innerHTML = '';
      let pos = 0;
      for (let i = 0; i < FRASE.length; i++) {
        const ch = FRASE[i];
        if (ch === ' ') {
          morseTopo.appendChild(el('span', { class: 'letras-morse-espaco' }, '/'));
          continue;
        }
        const revelada = letrasReveladas.has(pos);
        const cod = MORSE[ch] || '';
        morseTopo.appendChild(el('span', {
          class: 'letras-morse-letra' + (revelada ? ' revelada' : ''),
        }, revelada ? cod : '·'.repeat(cod.length).replace(/./g, '·')));
        pos++;
      }
    }
    container.appendChild(morseTopo);

    // ---- Compasso pulsando ----
    const compasso = criarCompasso('letras-parabens');
    container.appendChild(compasso);
    State.cleanupAtual = ativarCompasso(compasso, calcularTiming(State.bpm).beat);

    // ---- Fila da turma ----
    const fila = el('div', { class: 'letras-fila' });
    function renderFila() {
      fila.innerHTML = '';
      turmaLetras.forEach((p, i) => {
        const ehAtivo = i === entreguesIdx;
        const ehFeito = i < entreguesIdx;
        const slot = el('button', {
          class: 'letras-coleguinha' +
            (ehAtivo ? ' ativo' : '') +
            (ehFeito ? ' feito' : ''),
          'aria-label': ehFeito ? `${p.nome} já entregou` :
                        ehAtivo ? `${p.nome} entregar ${p.letras}` :
                        `aguarde ${p.nome}`,
          ...(!ehAtivo && !ehFeito ? { disabled: 'true' } : {}),
          onClick: () => entregar(i),
        });
        const svg = passaroSVG(p.quem);
        if (svg) {
          svg.style.width = '52px'; svg.style.height = '52px';
          svg.style.transform = 'scale(1)';
          slot.appendChild(svg);
        }
        slot.appendChild(el('div', { class: 'letras-coleguinha-letras' },
          ehFeito ? '✓' : p.letras));
        slot.appendChild(el('div', { class: 'letras-coleguinha-nome' }, p.nome));
        fila.appendChild(slot);
      });
    }
    container.appendChild(fila);

    // ---- Final da cena: Nena + bolo (inline, NÃO overlay fullscreen) ----
    const final = el('div', { class: 'letras-final escondido' });
    container.appendChild(final);

    function entregar(idx) {
      if (idx !== entreguesIdx) return;
      const p = turmaLetras[idx];
      Audio.unlock();

      // Calcula posição inicial das letras desse personagem na FRASE
      // (somando comprimentos dos anteriores).
      let posInicial = 0;
      for (let k = 0; k < idx; k++) {
        posInicial += turmaLetras[k].letras.length;
      }
      // Revela as letras dessa entrega
      for (let k = 0; k < p.letras.length; k++) {
        letrasReveladas.add(posInicial + k);
      }
      entreguesIdx++;
      renderFrase(); renderMorseFrase(); renderFila();

      // Toca cada letra entregue em Morse, em sequência
      const seqLetras = p.letras.split('').map(l => MORSE[l]).join(' ');
      tocarSequencia(seqLetras, { voz: 'sabia', repeticoes: 1 });

      if (entreguesIdx >= turmaLetras.length) {
        // Todos entregaram! Nena chega na cena (não fullscreen).
        setTimeout(() => mostrarFinal(), 600);
      }
    }

    function mostrarFinal() {
      final.classList.remove('escondido');
      final.replaceChildren(
        el('div', { class: 'letras-final-titulo' }, '✨ A turma cantou pra Nena! ✨'),
        el('div', { class: 'letras-final-bolo' }, [
          el('div', { class: 'bolo-velas' }, '🕯️ 🕯️ 🕯️ 🕯️ 🕯️'),
          el('div', { class: 'bolo-base' }, '🎂'),
        ]),
        el('div', { class: 'letras-final-temporada' }, '🌟 Fim da Temporada 1 🌟'),
        el('div', { class: 'letras-final-acoes' }, [
          el('button', {
            class: 'botao laranja',
            onClick: () => {
              Audio.unlock();
              celebrar(50);
              const seq = palavraParaMorse('PARABENS NENA');
              tocarSequencia(seq, { voz: 'sabia' });
            },
          }, '🎵 cantar parabéns'),
        ]),
      );
      celebrar(60);
      setTimeout(() => celebrar(40), 2500);
    }

    renderFrase(); renderMorseFrase(); renderFila();
  } else if (a.tipo === 'segredo-parabens') {
    // E6: turma sussurra (sem Nena). Botão "ensaiar" toca PARABENS NENA em
    // canto sabiá baixo. Botão "Nena chegou!" mostra overlay celebrando.
    const turma = [
      { quem: 'caca', nome: 'Caca' },
      { quem: 'jo',   nome: 'Jo'   },
      { quem: 'tete', nome: 'Tete' },
      { quem: 'tata', nome: 'Tata' },
      { quem: 'tito', nome: 'Tito' },
      { quem: 'lila', nome: 'Lila' },
      { quem: 'to',   nome: 'To'   },
      { quem: 'ben',  nome: 'Ben'  },
    ];

    const circulo = el('div', { class: 'roda-circulo segredo' });
    container.appendChild(circulo);

    function posicionar() {
      circulo.innerHTML = '';
      const total = turma.length;
      turma.forEach((item, i) => {
        const angulo = (i / total) * 2 * Math.PI - Math.PI / 2;
        const raio = 38;
        const x = 50 + raio * Math.cos(angulo);
        const y = 50 + raio * Math.sin(angulo);
        const slot = el('div', {
          class: 'roda-slot turma-segredo',
          style: `left:${x}%; top:${y}%;`,
        });
        const svg = passaroSVG(item.quem);
        if (svg) { svg.style.width = '52px'; svg.style.height = '52px'; svg.style.transform = 'scale(1)'; slot.appendChild(svg); }
        slot.appendChild(el('div', { class: 'roda-slot-nome' }, item.nome));
        circulo.appendChild(slot);
      });
    }
    posicionar();

    // v8 (Temporada 1): bolo no centro aparece quando Nena chega. Cinco velas
    // (idade simbólica, não a real da Gabriela). Festa mais longa: confete
    // contínuo por ~8s, overlay marca "Fim da Temporada 1".
    const bolo = el('div', { class: 'bolo-festa escondido' }, [
      el('div', { class: 'bolo-velas' }, '🕯️ 🕯️ 🕯️ 🕯️ 🕯️'),
      el('div', { class: 'bolo-base' }, '🎂'),
    ]);
    circulo.appendChild(bolo);

    const surpresa = el('div', { class: 'bento-overlay escondido' }, [
      el('div', { class: 'bento-overlay-frase', html: '🎉 <b>PARABÉNS, NENA!</b> 🎂' }),
      el('div', { class: 'bento-overlay-sub' }, 'a turma toda cantou pra ela'),
      el('div', { class: 'bento-overlay-temporada' }, '🌟 Fim da Temporada 1 🌟'),
    ]);
    container.appendChild(surpresa);

    const acoes = el('div', { class: 'cena-acoes', style: 'flex-wrap:wrap; gap:10px;' });
    const btnEnsaiar = el('button', {
      class: 'botao amarelo',
      onClick: () => {
        Audio.unlock();
        circulo.classList.add('sussurrando');
        const seq = palavraParaMorse('PARABENS NENA');
        tocarSequencia(seq, {
          voz: 'sabia',
          onFim: () => circulo.classList.remove('sussurrando'),
        });
      }
    }, '🎵 ensaiar baixinho');
    acoes.appendChild(btnEnsaiar);
    acoes.appendChild(el('button', {
      class: 'botao laranja',
      onClick: () => {
        Audio.unlock();
        surpresa.classList.remove('escondido');
        bolo.classList.remove('escondido');
        circulo.classList.add('festa');
        celebrar(60);
        // Segunda rodada de confete a 3s pra estender a festa
        setTimeout(() => celebrar(50), 3000);
        const seq = palavraParaMorse('PARABENS NENA');
        tocarSequencia(seq, { voz: 'sabia' });
        // Overlay fica até a criança apertar pra continuar (sem auto-hide)
      }
    }, '🎂 Nena chegou!'));
    container.appendChild(acoes);
  } else if (a.tipo === 'roda-apresentacao') {
    // Roda interativa: 7 personagens em círculo. Sequência guiada por seta.
    // Cada toque na criança ativa toca "EU SOU [nome]" + SOS. Easter-egg BENTO
    // quando Ben (último) fala — antes de habilitar continuar.
    const seq = a.sequencia;
    let idx = 0;          // próximo da sequência
    const falados = new Set();
    let bentoMostrado = false;

    const circulo = el('div', { class: 'roda-circulo', 'aria-label': 'roda de apresentação' });
    container.appendChild(circulo);

    const status = el('div', {
      class: 'roda-status',
      'aria-live': 'polite',
    });
    container.appendChild(status);

    // Easter-egg overlay: aparece quando Ben (último) fala
    const bentoOverlay = el('div', { class: 'bento-overlay escondido' }, [
      el('div', { class: 'bento-overlay-frase', html: '<em>Ben</em> + <em>To</em> = <b>BENTO</b>' }),
      el('div', { class: 'bento-overlay-sub' }, 'descoberta da turma!'),
    ]);
    container.appendChild(bentoOverlay);

    function posicionarPersonagens() {
      circulo.innerHTML = '';
      const total = seq.length;
      seq.forEach((item, i) => {
        const angulo = (i / total) * 2 * Math.PI - Math.PI / 2; // começa do topo
        const raio = 38; // % do container do círculo
        const x = 50 + raio * Math.cos(angulo);
        const y = 50 + raio * Math.sin(angulo);
        const ehAtivo = idx < seq.length && seq[idx].quem === item.quem;
        const ehFalado = falados.has(item.quem);
        const slot = el('button', {
          class: 'roda-slot' + (ehFalado ? ' falou' : '') + (ehAtivo ? ' ativo' : ''),
          style: `left: ${x}%; top: ${y}%;`,
          'aria-label': ehFalado ? `${item.nome} já se apresentou` : (ehAtivo ? `tocar para ${item.nome} se apresentar` : `aguarde ${item.nome}`),
          ...(!ehAtivo && !ehFalado ? { disabled: 'true' } : {}),
          onClick: () => apresentar(item),
        });
        const svg = passaroSVG(item.quem);
        if (svg) {
          svg.style.width = '52px';
          svg.style.height = '52px';
          svg.style.transform = 'scale(1)';
          slot.appendChild(svg);
        }
        slot.appendChild(el('div', { class: 'roda-slot-nome' }, item.nome));
        circulo.appendChild(slot);
      });
    }

    function atualizaStatus() {
      if (idx >= seq.length) {
        status.innerHTML = '🎉 <b>roda fechada!</b> todo mundo se apresentou.';
        return;
      }
      const proximo = seq[idx];
      status.innerHTML = `🎯 toca em <b>${proximo.nome}</b>`;
    }

    function apresentar(item) {
      if (idx >= seq.length || seq[idx].quem !== item.quem) return;
      if (falados.has(item.quem)) return;

      falados.add(item.quem);
      idx++;

      Audio.unlock();
      const ehUltimo = idx >= seq.length;

      // Sequência: NOME espaço-de-palavra SOS
      const morseNome = palavraParaMorse(item.nome.toUpperCase());
      const seqCompleta = morseNome + ' / ' + MORSE['S'] + ' ' + MORSE['O'] + ' ' + MORSE['S'];

      tocarSequencia(seqCompleta, {
        voz: 'sabia',
        onFim: () => {
          if (ehUltimo && !bentoMostrado) {
            bentoMostrado = true;
            bentoOverlay.classList.remove('escondido');
            celebrar(20);
            setTimeout(() => bentoOverlay && bentoOverlay.classList.add('escondido'), 3500);
          }
          atualizaStatus();
          posicionarPersonagens();
        },
      });

      atualizaStatus();
      posicionarPersonagens();
    }

    posicionarPersonagens();
    atualizaStatus();
  }
}

/* ============================================================
   TECLADO LIVRE
   ============================================================ */
// v8 (Temporada 1): vocabulário cresce com família, padrinhos afetivos e jogos.
// Combos família/padrinhos com espaço viram " / " em Morse (espaço de palavra).
// Display com hífen (PAPA-TO) é só visual nos chips do teclado.
const PALAVRAS_RAPIDAS = [
  'SOS', 'BENTO', 'NENA', 'PARABENS NENA',
  // turma
  'TO', 'BEN', 'CACA', 'JO', 'TETE', 'TATA', 'TITO', 'LILA', 'OI',
  // família e padrinhos
  'PAPA', 'MAMA', 'VOVO', 'PAIO', 'MAIO',
  // combos afetivos (mostrados como PAPA-TO / MAMA-TO / VOVO-TO / PAIO-TO / MAIO-TO)
  'PAPA TO', 'MAMA TO', 'VOVO TO', 'PAIO TO', 'MAIO TO',
  // jogos cooperativos
  'ALTINHA', 'FRESCOBOL',
];
const ALFABETO = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
// 4 velocidades nomeadas (Lucas pediu: "tartaruga, menino, coelho, guepardo").
// O conceito de BPM contínuo via slider foi descartado — a criança escolhe entre
// 4 níveis claros. Os BPMs aqui são o "BPM real" que vai pra calcularTiming.
// Default: menino (75 BPM). Antes era 120, que Lucas reportou rápido demais.
// v9.2: 4 velocidades. As 3 primeiras (sem guepardo) são usadas em telas
// com áudio infantil. Velocidades pela METADE pras crianças (Lucas v9.2).
const VELOCIDADES = [
  { id: 'tartaruga', emoji: '🐢', nome: 'tartaruga', bpm: 25 },
  { id: 'menino',    emoji: '🚶', nome: 'menino',    bpm: 38 },
  { id: 'coelho',    emoji: '🐰', nome: 'coelho',    bpm: 55 },
  { id: 'guepardo',  emoji: '🐆', nome: 'guepardo',  bpm: 80 },
];
const VELOCIDADES_REDUZIDAS = VELOCIDADES.slice(0, 3); // sem guepardo
const VALORES_BPM = VELOCIDADES.map(v => v.bpm);

// Cria seletor de velocidade reusável (4 chips: tartaruga..guepardo).
// Usado na Tela Pulso, Teclado-explorar e cenas que têm o pulso destacado.
function criarSeletorVelocidade(onChange) {
  return _criarSeletorVelocidadeBase(VELOCIDADES, onChange);
}
// v9.2: variante 3-níveis (sem guepardo) pra cenas com áudio + outras telas
// onde "guepardo" seria rápido demais pra criança de 5 anos.
function criarSeletorVelocidadeReduzido(onChange) {
  return _criarSeletorVelocidadeBase(VELOCIDADES_REDUZIDAS, onChange);
}
function _criarSeletorVelocidadeBase(lista, onChange) {
  const wrap = el('div', { class: 'velocidade-seletor', 'aria-label': 'velocidade' });
  // Se BPM atual NÃO está na lista (por ex usuário tinha guepardo e a tela
  // só mostra 3 níveis), seleciona o mais próximo abaixo.
  const bpmAtual = State.bpm;
  const ativoBpm = lista.find(v => v.bpm === bpmAtual)
    ? bpmAtual
    : lista[lista.length - 1].bpm;
  lista.forEach(v => {
    const ativo = ativoBpm === v.bpm;
    const chip = el('button', {
      class: 'chip-velocidade' + (ativo ? ' ativo' : ''),
      'aria-label': `velocidade ${v.nome}`,
      'aria-pressed': ativo ? 'true' : 'false',
      onClick: function() {
        State.bpm = v.bpm;
        salvarEstado();
        wrap.querySelectorAll('.chip-velocidade').forEach(c => {
          c.classList.remove('ativo');
          c.setAttribute('aria-pressed', 'false');
        });
        this.classList.add('ativo');
        this.setAttribute('aria-pressed', 'true');
        if (typeof onChange === 'function') onChange(v.bpm);
      }
    }, [
      el('span', { class: 'chip-vel-emoji' }, v.emoji),
      el('span', { class: 'chip-vel-nome' }, v.nome),
    ]);
    wrap.appendChild(chip);
  });
  return wrap;
}

// v9.1 (D1+D2): modo CRIANÇA do teclado.
// Sem alfabeto, sem config técnica. Só palavras prontas em chips grandes,
// display da palavra escolhida, e botão "ouvir" gigante. Bento de 5 anos
// não precisa mapear letra→Morse — escolhe palavra pronta e ouve.
function renderTecladoCrianca(tela, wrap) {
  // Curadoria reduzida pra criança: nomes, palavras curtas, combos afetivos.
  const PALAVRAS_CRIANCA = [
    'BENTO', 'NENA', 'TO', 'BEN',
    'PAPA', 'MAMA', 'VOVO',
    'CACA', 'JO', 'TETE', 'TATA', 'TITO', 'LILA',
    'OI', 'SOS', 'PAPA TO', 'MAMA TO', 'VOVO TO',
  ];
  const COMBOS_AFETO = new Set(['PAPA TO', 'MAMA TO', 'VOVO TO']);
  const ESPECIAIS = new Set(['BENTO', 'NENA']);

  // Display da palavra escolhida
  const display = el('div', { class: 'crianca-display vazio' }, 'escolhe uma palavra');
  const morseDisp = el('div', { class: 'morse-display crianca-morse' });
  const compasso = criarCompasso('crianca');
  wrap.appendChild(display);
  wrap.appendChild(morseDisp);
  wrap.appendChild(compasso);

  // v9.2: seletor 3-velocidades (sem guepardo) — Lucas
  wrap.appendChild(criarSeletorVelocidadeReduzido());

  let palavraEscolhida = null;

  function escolher(p) {
    palavraEscolhida = p;
    const txtVisivel = COMBOS_AFETO.has(p) ? p.replace(' ', '-') : p;
    display.classList.remove('vazio');
    display.textContent = txtVisivel;
    morseDisp.innerHTML = renderMorse(palavraParaMorse(p));
    wrap.querySelectorAll('.palavra-rapida').forEach(b => {
      b.classList.toggle('escolhida', b.dataset.p === p);
    });
  }

  // Botão tocar GRANDE
  const btnTocar = el('button', { class: 'botao laranja crianca-tocar' }, '🔊 ouvir');
  btnTocar.addEventListener('click', () => {
    Audio.unlock();
    if (!palavraEscolhida) return;
    if (State.reproduzindo) {
      pararLoop();
      btnTocar.textContent = '🔊 ouvir';
      return;
    }
    btnTocar.textContent = '⏸ parar';
    const seq = palavraParaMorse(palavraEscolhida);
    const els = morseDisp.querySelectorAll('.ponto, .traco');
    tocarSequencia(seq, {
      voz: State.vozTeclado,
      compasso,
      onElemento: (ch, i) => {
        els.forEach(e => e.classList.remove('ativo'));
        if (els[i]) {
          els[i].classList.add('ativo');
          setTimeout(() => els[i].classList.remove('ativo'), ch === '.' ? 100 : 300);
        }
      },
      onFim: () => { btnTocar.textContent = '🔊 ouvir'; },
    });
  });
  wrap.appendChild(el('div', { style: 'display:flex; justify-content:center; margin: 8px 0;' }, [btnTocar]));

  // Chips grandes
  const chips = el('div', { class: 'crianca-chips' });
  PALAVRAS_CRIANCA.forEach(p => {
    const ehCombo = COMBOS_AFETO.has(p);
    const ehEspecial = ESPECIAIS.has(p);
    const txt = ehCombo ? p.replace(' ', '-') : p;
    const chip = el('button', {
      class: 'palavra-rapida crianca' + (ehEspecial ? ' especial' : '') + (ehCombo ? ' combo' : ''),
      'data-p': p,
      onClick: () => escolher(p),
    }, txt);
    chips.appendChild(chip);
  });
  wrap.appendChild(chips);
}

function renderTeclado(tela) {
  const wrap = el('div', { class: 'teclado-wrap' });

  // v9.1 (D1+D2): toggle modo criança/explorar no topo
  const toggleModo = el('div', { class: 'teclado-modo-toggle' });
  ['crianca', 'explorar'].forEach(m => {
    const labels = { crianca: ['🧒', 'crianç'+'a'], explorar: ['🔤', 'explorar'] };
    const [emoji, txt] = labels[m];
    const btn = el('button', {
      class: 'teclado-modo' + (State.tecladoModo === m ? ' ativo' : ''),
      'aria-pressed': String(State.tecladoModo === m),
      onClick: () => {
        if (State.tecladoModo === m) return;
        State.tecladoModo = m;
        salvarEstado();
        // Re-render sem perder texto digitado
        tela.innerHTML = '';
        renderTeclado(tela);
      },
    }, [
      el('span', { class: 'teclado-modo-emoji' }, emoji),
      el('span', {}, txt),
    ]);
    toggleModo.appendChild(btn);
  });
  wrap.appendChild(toggleModo);

  // Modo CRIANÇA: chips grandes + display + tocar. Sem alfabeto, sem config.
  if (State.tecladoModo === 'crianca') {
    renderTecladoCrianca(tela, wrap);
    tela.appendChild(wrap);
    return;
  }

  // Configuração compacta
  const config = el('div', { class: 'teclado-config' });

  // Linha 1: voz
  const linhaVoz = el('div', { class: 'config-linha' });
  linhaVoz.appendChild(el('span', { class: 'config-rotulo' }, 'Voz'));
  ['sabia', 'palma', 'telegrafo', 'violao', 'coracao'].forEach(v => {
    const labels = { sabia: ['🐦', 'sabiá'], palma: ['👏', 'palma'], telegrafo: ['⚡', 'telégrafo'], violao: ['🎸', 'guitarra'], coracao: ['🫀', 'ta-tum'] };
    const [emoji, txt] = labels[v];
    linhaVoz.appendChild(el('button', {
      class: 'chip' + (State.vozTeclado === v ? ' laranja-ativo' : ''),
      onClick: function() {
        State.vozTeclado = v;
        salvarEstado();
        renderTeclado(tela.replaceChildren ? tela : tela);
        renderApp();
      }
    }, [
      el('span', { class: 'chip-emoji' }, emoji),
      el('span', {}, txt),
    ]));
  });
  config.appendChild(linhaVoz);

  // Linha 2: notação + repetições
  const linhaNot = el('div', { class: 'config-linha' });
  linhaNot.appendChild(el('span', { class: 'config-rotulo' }, 'Símbolo'));
  linhaNot.appendChild(el('button', {
    class: 'chip' + (!State.notacaoBinaria ? ' ativo' : ''),
    onClick: () => { State.notacaoBinaria = false; salvarEstado(); renderApp(); }
  }, '·  –'));
  linhaNot.appendChild(el('button', {
    class: 'chip' + (State.notacaoBinaria ? ' ativo' : ''),
    onClick: () => { State.notacaoBinaria = true; salvarEstado(); renderApp(); }
  }, '0  1'));
  config.appendChild(linhaNot);

  // Linha 3: velocidade — 4 chips nomeados (tartaruga, menino, coelho, guepardo)
  const linhaBpm = el('div', { class: 'config-linha' });
  linhaBpm.appendChild(el('span', { class: 'config-rotulo' }, 'Ritmo'));
  linhaBpm.appendChild(criarSeletorVelocidade());
  config.appendChild(linhaBpm);

  // Linha 4: repetições + loop
  const linhaLoop = el('div', { class: 'config-linha' });
  linhaLoop.appendChild(el('span', { class: 'config-rotulo' }, 'Tocar'));
  let repAtual = 1;
  const reps = [1, 2, 4, 8];
  const chipsRep = reps.map(r => {
    const c = el('button', {
      class: 'chip' + (r === 1 ? ' verde-ativo' : ''),
      'data-rep': r,
      onClick: function() {
        chipsRep.forEach(c => c.classList.remove('verde-ativo'));
        this.classList.add('verde-ativo');
        repAtual = r;
        if (State.loopInfinito) {
          State.loopInfinito = false;
          chipLoop.classList.remove('laranja-ativo');
        }
      }
    }, r + '×');
    return c;
  });
  chipsRep.forEach(c => linhaLoop.appendChild(c));
  const chipLoop = el('button', {
    class: 'chip' + (State.loopInfinito ? ' laranja-ativo' : ''),
    onClick: function() {
      State.loopInfinito = !State.loopInfinito;
      this.classList.toggle('laranja-ativo');
      if (State.loopInfinito) {
        chipsRep.forEach(c => c.classList.remove('verde-ativo'));
      } else {
        chipsRep[0].classList.add('verde-ativo');
        repAtual = 1;
        pararLoop();
      }
    }
  }, [el('span', { class: 'chip-emoji' }, '↻'), el('span', {}, 'loop')]);
  linhaLoop.appendChild(chipLoop);
  config.appendChild(linhaLoop);

  wrap.appendChild(config);

  // Display
  const display = el('div', { class: 'teclado-input vazio', id: 'tec-input' });
  wrap.appendChild(display);

  const morseDisp = el('div', {
    class: 'morse-display',
    id: 'tec-morse',
    style: 'font-size: clamp(18px, 4.8vw, 28px); min-height: 36px; margin: 0;'
  });
  wrap.appendChild(morseDisp);

  // Cabeça de compasso — aparece pulsando enquanto a palavra toca
  const compassoTec = criarCompasso('pulso');
  wrap.appendChild(compassoTec);

  function atualizaInput() {
    if (State.texto.length === 0) {
      display.classList.add('vazio'); display.textContent = '';
      morseDisp.innerHTML = '';
    } else {
      display.classList.remove('vazio');
      display.textContent = State.texto;
      morseDisp.innerHTML = renderMorse(palavraParaMorse(State.texto));
    }
  }

  // Botões principais
  const principal = el('div', { style: 'display:flex; gap:8px; justify-content:center; margin: 4px 0;' });
  principal.appendChild(el('button', {
    class: 'botao laranja grande',
    onClick: function() {
      Audio.unlock();
      // v8.4 fix do botão pausar: antes o handler SEMPRE chamava
      // tocarSequencia, então clicar em "⏸ parar" reiniciava em vez de
      // parar. Agora se já está tocando, pausa.
      if (State.reproduzindo) {
        pararLoop();
        this.textContent = '▶ tocar';
        return;
      }
      if (!State.texto) return;
      const seq = palavraParaMorse(State.texto);
      this.textContent = '⏸ parar';
      const original = this;
      tocarSequencia(seq, {
        voz: State.vozTeclado,
        repeticoes: State.loopInfinito ? 1 : repAtual,
        infinito: State.loopInfinito,
        compasso: compassoTec,
        onElemento: (ch, i) => {
          // anima o elemento correspondente no display
          const els = morseDisp.querySelectorAll('.ponto, .traco');
          els.forEach(e => e.classList.remove('ativo'));
          if (els[i]) {
            els[i].classList.add('ativo');
            setTimeout(() => els[i].classList.remove('ativo'), ch === '.' ? 100 : 300);
          }
        },
        onFim: () => {
          original.innerHTML = '▶ tocar';
        }
      });
    }
  }, '▶ tocar'));
  principal.appendChild(el('button', {
    class: 'botao secundario',
    onClick: () => { pararLoop(); State.texto = ''; atualizaInput(); }
  }, '↻ limpar'));
  wrap.appendChild(principal);

  // Palavras rápidas. v8: combos afetivos (PAPA TO etc) viram chips dourados
  // com display em hífen (PAPA-TO) — pedagogicamente lê-se "papa-to" mas em
  // Morse vira espaço de palavra entre PAPA e TO (separador `/`).
  const COMBOS_AFETO = new Set(['PAPA TO', 'MAMA TO', 'VOVO TO', 'PAIO TO', 'MAIO TO']);
  const palavras = el('div', { class: 'palavras-rapidas' });
  PALAVRAS_RAPIDAS.forEach(p => {
    const ehCombo = COMBOS_AFETO.has(p);
    const ehEspecial = (p === 'BENTO' || p === 'PARABENS NENA');
    const display = ehCombo ? p.replace(' ', '-') : p;
    palavras.appendChild(el('button', {
      class: 'palavra-rapida' + (ehEspecial ? ' especial' : '') + (ehCombo ? ' combo' : ''),
      onClick: () => { State.texto = p.slice(0, 20); atualizaInput(); }
    }, display));
  });
  wrap.appendChild(palavras);

  // Grade alfabeto
  const grade = el('div', { class: 'teclado-grade' });
  for (const letra of ALFABETO) {
    const cod = MORSE[letra];
    grade.appendChild(el('button', {
      class: 'tecla',
      onClick: () => {
        Audio.unlock();
        if (State.texto.length >= 20) return;
        State.texto += letra;
        atualizaInput();
        // Toca apenas essa letra como feedback
        tocarSequencia(cod, { voz: State.vozTeclado });
      }
    }, [
      el('span', { class: 'nome' }, letra),
      el('span', { class: 'codigo' },
        State.notacaoBinaria
          ? cod.replaceAll('.','0').replaceAll('-','1')
          : cod.replaceAll('.','·').replaceAll('-','–')),
    ]));
  }
  grade.appendChild(el('button', {
    class: 'tecla especial',
    onClick: () => {
      if (State.texto.length >= 20 || State.texto.endsWith(' ') || !State.texto) return;
      State.texto += ' '; atualizaInput();
    }
  }, [el('span', { class: 'nome', style: 'font-size:14px;' }, '_')]));
  grade.appendChild(el('button', {
    class: 'tecla deletar',
    onClick: () => { State.texto = State.texto.slice(0, -1); atualizaInput(); }
  }, [el('span', { class: 'nome', style: 'font-size:18px;' }, '⌫')]));

  wrap.appendChild(grade);

  tela.appendChild(wrap);
  atualizaInput();
}

/* ============================================================
   LETRA POR LETRA
   ============================================================ */
function renderLetras(tela) {
  const wrap = el('div', {});

  // v9.0: contador de letras visitadas pra dar sentido de progresso
  const visitadas = Array.from(State.cumpridas).filter(c => c.startsWith('letra:')).length;
  const subtitulo = visitadas === 0
    ? '26 letras, 26 palavras. Toca pra ver e ouvir.'
    : `${visitadas}/26 letras visitadas — continua!`;
  wrap.appendChild(el('p', {
    style: 'text-align:center; font-family: var(--display); font-style:italic; color: var(--tinta-suave); font-size: 15px; margin: 8px 0 12px;'
  }, subtitulo));

  // v9.0: vogais com fundo amarelo, consoantes com cor padrão.
  // Categoria visual sem precisar ler — Bento de 5 anos diferencia
  // por cor antes de saber dizer "vogal".
  const VOGAIS = new Set(['A', 'E', 'I', 'O', 'U']);

  const grade = el('div', { class: 'letras-grade' });
  for (const letra of ALFABETO) {
    const palavra = PALAVRAS_LETRA[letra];
    const cod = MORSE[letra];
    const visitada = State.cumpridas.has('letra:' + letra);
    const classes = [
      'letra-card',
      VOGAIS.has(letra) ? 'vogal' : 'consoante',
      visitada ? 'visitada' : '',
    ].filter(Boolean).join(' ');
    const card = el('button', {
      class: classes,
      onClick: () => {
        Audio.unlock();
        navegar('letra-detalhe', { letra });
      }
    }, [
      el('span', { class: 'l' }, letra),
      el('span', { class: 'palavra' }, palavra),
      el('span', { class: 'codigo' },
        State.notacaoBinaria
          ? cod.replaceAll('.','0').replaceAll('-','1')
          : cod.replaceAll('.','·').replaceAll('-','–')),
    ]);
    if (visitada) {
      card.appendChild(el('span', { class: 'visita-marca', 'aria-label': 'já visitou' }, '✓'));
    }
    grade.appendChild(card);
  }
  wrap.appendChild(grade);
  tela.appendChild(wrap);
}

function renderLetraDetalhe(tela, letra) {
  const lista = PALAVRAS_LETRA_LISTA[letra] || [PALAVRAS_LETRA[letra]];
  let palavraAtual = lista[0];
  const codLetra = MORSE[letra];

  // v9.1 (PR2): NÃO marca mais automaticamente. Criança aperta "🌟 carimbei!"
  // quando se sente pronta. Auto-mark virou simulação de aprendizado;
  // carimbar é AÇÃO da criança — pedagogicamente mais forte.
  // (A1 do PR1 fez auto-mark; o PR2 reverte e dá agência.)

  const wrap = el('div', { class: 'letra-detalhe' });

  // Sabiá presente
  const passaroWrap = el('div', { style: 'margin: 8px 0;' });
  const sabia = passaroSVG('to');
  sabia.style.width = '110px'; sabia.style.height = '110px';
  passaroWrap.appendChild(sabia);
  wrap.appendChild(passaroWrap);

  // Letra grande
  wrap.appendChild(el('div', { class: 'letra-display' }, letra));

  // Forma rítmica
  const tempo = el('div', { class: 'tempo-indicador' });
  codLetra.split('').forEach(ch => {
    tempo.appendChild(el('div', {
      class: 'tempo-pulso ' + (ch === '.' ? 'curto' : 'longo')
    }));
  });
  wrap.appendChild(tempo);

  // Símbolo Morse da letra
  const morseLetra = el('div', { class: 'morse-display', html: renderMorse(codLetra) });
  wrap.appendChild(morseLetra);

  // "É de palavra" — atualizado dinamicamente quando troca de chip
  const fraseE = el('div', {
    class: 'cena-fala',
    style: 'background: transparent; border:none; box-shadow:none; font-style:italic;',
  });
  wrap.appendChild(fraseE);

  // Palavra grande — atualizada
  const palavraDisp = el('div', {
    class: 'palavra-display',
    style: 'font-size: clamp(24px, 6vw, 36px); margin: 4px 0;',
  });
  wrap.appendChild(palavraDisp);

  // Morse da palavra — atualizado
  const morsePalavra = el('div', {
    class: 'morse-display',
    style: 'font-size: clamp(20px, 5vw, 28px); min-height: 36px;',
  });
  wrap.appendChild(morsePalavra);

  // 5 chips com as palavras alternativas (1ª = default ativa)
  const chipsLista = el('div', {
    class: 'letra-chips',
    'aria-label': '5 palavras com a letra ' + letra,
  });
  wrap.appendChild(chipsLista);

  function atualizarPalavra(p) {
    palavraAtual = p;
    fraseE.replaceChildren(
      el('span', {}, letra + ' é de '),
      el('b', {}, p),
    );
    palavraDisp.textContent = p.toUpperCase();
    morsePalavra.innerHTML = renderMorse(palavraParaMorse(p));
    chipsLista.querySelectorAll('.letra-chip').forEach(b => {
      b.classList.toggle('ativa', b.dataset.palavra === p);
    });
  }
  lista.forEach(p => {
    chipsLista.appendChild(el('button', {
      class: 'letra-chip',
      'data-palavra': p,
      onClick: () => atualizarPalavra(p),
    }, p));
  });
  atualizarPalavra(palavraAtual);

  // Cabeça de compasso compartilhada por letra e palavra
  const compassoLetra = criarCompasso('pulso');
  wrap.appendChild(compassoLetra);

  // Botões
  const botoes = el('div', { class: 'cena-acoes', style: 'flex-wrap:wrap;' });

  // v9.0: "ouvir letra" virou toggle de LOOP INFINITO (como em Coleguinhas).
  // Criança de 5 anos quer ouvir 10x sem clicar 10x. Quando tocando vira "⏸ parar".
  const btnOuvir = el('button', { class: 'botao laranja' }, '🔁 ouvir letra');
  let tocandoLetra = false;
  function pararLetra() {
    pararLoop();
    tocandoLetra = false;
    btnOuvir.textContent = '🔁 ouvir letra';
    btnOuvir.classList.remove('tocando');
  }
  btnOuvir.addEventListener('click', () => {
    Audio.unlock();
    if (tocandoLetra) { pararLetra(); return; }
    tocandoLetra = true;
    btnOuvir.textContent = '⏸ parar';
    btnOuvir.classList.add('tocando');
    const els = morseLetra.querySelectorAll('.ponto, .traco');
    const pulsos = tempo.querySelectorAll('.tempo-pulso');
    tocarSequencia(codLetra, {
      voz: 'sabia',
      compasso: compassoLetra,
      infinito: true,
      onElemento: (ch, i) => {
        els.forEach(e => e.classList.remove('ativo'));
        pulsos.forEach(p => p.classList.remove('ativo'));
        if (els[i]) { els[i].classList.add('ativo'); setTimeout(() => els[i].classList.remove('ativo'), 250); }
        if (pulsos[i]) { pulsos[i].classList.add('ativo'); setTimeout(() => pulsos[i].classList.remove('ativo'), 250); }
      }
    });
  });
  botoes.appendChild(btnOuvir);
  // v9.2: "ouvir palavra" e "guitarra" agora são toggles (pause funciona).
  const btnPalavra = el('button', { class: 'botao' }, '🐦 ouvir palavra');
  let tocandoPalavra = false;
  function pararPalavra() {
    pararLoop();
    tocandoPalavra = false;
    btnPalavra.textContent = '🐦 ouvir palavra';
  }
  btnPalavra.addEventListener('click', () => {
    Audio.unlock();
    pararLetra();
    if (tocandoPalavra) { pararPalavra(); return; }
    tocandoPalavra = true;
    btnPalavra.textContent = '⏸ parar';
    const codAtual = palavraParaMorse(palavraAtual);
    const els = morsePalavra.querySelectorAll('.ponto, .traco');
    tocarSequencia(codAtual, {
      voz: 'sabia',
      compasso: compassoLetra,
      onElemento: (ch, i) => {
        els.forEach(e => e.classList.remove('ativo'));
        if (els[i]) { els[i].classList.add('ativo'); setTimeout(() => els[i].classList.remove('ativo'), 250); }
      },
      onFim: () => { tocandoPalavra = false; btnPalavra.textContent = '🐦 ouvir palavra'; },
    });
  });
  botoes.appendChild(btnPalavra);

  const btnGuitarra = el('button', { class: 'botao secundario' }, '🎸 guitarra');
  let tocandoGuitarra = false;
  function pararGuitarra() {
    pararLoop();
    tocandoGuitarra = false;
    btnGuitarra.textContent = '🎸 guitarra';
  }
  btnGuitarra.addEventListener('click', () => {
    Audio.unlock();
    pararLetra(); pararPalavra();
    if (tocandoGuitarra) { pararGuitarra(); return; }
    tocandoGuitarra = true;
    btnGuitarra.textContent = '⏸ parar';
    tocarSequencia(palavraParaMorse(palavraAtual), {
      voz: 'violao',
      onFim: () => { tocandoGuitarra = false; btnGuitarra.textContent = '🎸 guitarra'; },
    });
  });
  botoes.appendChild(btnGuitarra);
  wrap.appendChild(botoes);

  // v9.2: seletor 3-velocidades (sem guepardo) — Lucas pediu em todas as
  // telas com áudio. Reage a mudança de BPM atualizando o som ao próximo play.
  wrap.appendChild(criarSeletorVelocidadeReduzido(() => pararLetra()));

  // v9.1 (A4): botão "🌟 CARIMBEI!" — criança decide quando marcou.
  // Já carimbada? Mostra "✨ você carimbou esta letra" (fechado, mas pode
  // re-abrir se quiser desmarcar — opcional, por enquanto só feedback).
  const jaCarimbada = State.cumpridas.has('letra:' + letra);
  const carimboWrap = el('div', { class: 'carimbo-wrap' });
  if (jaCarimbada) {
    carimboWrap.appendChild(el('div', { class: 'carimbo-feito' }, [
      el('span', { class: 'carimbo-selo' }, '🌟'),
      el('span', { class: 'carimbo-texto' }, 'você carimbou!'),
    ]));
  } else {
    const btnCarimbo = el('button', { class: 'botao-carimbo' }, '🌟 carimbei!');
    btnCarimbo.addEventListener('click', () => {
      State.cumpridas.add('letra:' + letra);
      salvarEstado();
      // Animação: o botão vira o selo e cresce
      btnCarimbo.disabled = true;
      btnCarimbo.classList.add('disparando');
      // Confete pequeno (10 partículas, do botão pra cima)
      const cores = ['#C9622E', '#F4D35E', '#6FAE5C', '#5C9CE8'];
      const overlay = el('div', { class: 'pulso-confete-overlay' });
      for (let i = 0; i < 10; i++) {
        const c = el('div', { class: 'pulso-confete' });
        c.style.left = (40 + Math.random() * 20) + '%';
        c.style.top = '60vh';
        c.style.background = cores[i % cores.length];
        c.style.animationDelay = (Math.random() * 0.2) + 's';
        c.style.animationDuration = (1 + Math.random() * 0.4) + 's';
        overlay.appendChild(c);
      }
      document.body.appendChild(overlay);
      setTimeout(() => overlay.parentNode && overlay.remove(), 1800);
      // Substitui o botão pelo "feito" após animação
      setTimeout(() => {
        carimboWrap.innerHTML = '';
        carimboWrap.appendChild(el('div', { class: 'carimbo-feito' }, [
          el('span', { class: 'carimbo-selo' }, '🌟'),
          el('span', { class: 'carimbo-texto' }, 'você carimbou!'),
        ]));
      }, 600);
    });
    carimboWrap.appendChild(btnCarimbo);
  }
  wrap.appendChild(carimboWrap);

  // Navegação anterior/próxima — v9.1 (A5): "Caderno do Bento"
  // Visualmente como páginas: número da letra atual ("S · 19/26"),
  // setões grandes nas laterais, e SWIPE horizontal pra trocar.
  const idx = ALFABETO.indexOf(letra);
  const navega = el('div', { class: 'caderno-nav' });
  const btnAnt = el('button', {
    class: 'caderno-seta esq' + (idx === 0 ? ' invisivel' : ''),
    'aria-label': idx > 0 ? 'letra anterior ' + ALFABETO[idx - 1] : 'sem anterior',
  }, '◀');
  if (idx > 0) {
    btnAnt.addEventListener('click', () => irParaLetra(ALFABETO[idx - 1], 'esq'));
  }
  const pagina = el('div', { class: 'caderno-pagina' }, [
    el('span', { class: 'caderno-letra-atual' }, letra),
    el('span', { class: 'caderno-pos' }, `${idx + 1} / 26`),
  ]);
  const btnPrx = el('button', {
    class: 'caderno-seta dir' + (idx === ALFABETO.length - 1 ? ' invisivel' : ''),
    'aria-label': idx < ALFABETO.length - 1 ? 'próxima letra ' + ALFABETO[idx + 1] : 'sem próxima',
  }, '▶');
  if (idx < ALFABETO.length - 1) {
    btnPrx.addEventListener('click', () => irParaLetra(ALFABETO[idx + 1], 'dir'));
  }
  navega.appendChild(btnAnt);
  navega.appendChild(pagina);
  navega.appendChild(btnPrx);
  wrap.appendChild(navega);

  function irParaLetra(novaLetra, direcao) {
    // Anima saída + nova render
    wrap.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    wrap.style.transform = `translateX(${direcao === 'dir' ? '-' : ''}24px)`;
    wrap.style.opacity = '0';
    setTimeout(() => navegar('letra-detalhe', { letra: novaLetra }), 200);
  }

  // Swipe horizontal: arrasta dedo > 60px = troca página
  let touchStartX = null;
  wrap.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  wrap.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) < 60) return;
    if (dx > 0 && idx > 0) irParaLetra(ALFABETO[idx - 1], 'esq');
    else if (dx < 0 && idx < ALFABETO.length - 1) irParaLetra(ALFABETO[idx + 1], 'dir');
  }, { passive: true });

  tela.appendChild(wrap);
}

/* ============================================================
   HANDLERS GLOBAIS
   ============================================================ */
$('#btn-voltar').addEventListener('click', () => {
  pararLoop();
  if (State.modo === 'letra-detalhe') navegar('letras');
  else navegar('landing');
});

// v8.6: handlers do controle de som
function atualizarControleSomUI() {
  const btn = $('#btn-mute');
  const slider = $('#slider-volume');
  if (!btn || !slider) return;
  btn.classList.toggle('mudo', State.mudo);
  btn.textContent = State.mudo ? '🔇' : '🔊';
  btn.setAttribute('aria-pressed', State.mudo ? 'true' : 'false');
  btn.setAttribute('aria-label', State.mudo ? 'ligar som' : 'desligar som');
  slider.classList.toggle('mudo', State.mudo);
  slider.value = String(Math.round(State.volume * 100));
  slider.setAttribute('aria-valuetext',
    State.mudo ? 'mudo' : `volume ${Math.round(State.volume * 100)}%`);
}
$('#btn-mute').addEventListener('click', () => {
  State.mudo = !State.mudo;
  Audio.setMuted(State.mudo);
  atualizarControleSomUI();
  salvarEstado();
});
$('#slider-volume').addEventListener('input', (ev) => {
  const v = parseFloat(ev.target.value) / 100;
  State.volume = v;
  // Mexer no slider sai automaticamente do mute
  if (State.mudo) {
    State.mudo = false;
    Audio.setMuted(false);
  }
  Audio.setVolume(v);
  atualizarControleSomUI();
  // Salva debounced pra não martelar localStorage
  clearTimeout(window._volumeSaveT);
  window._volumeSaveT = setTimeout(salvarEstado, 200);
});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
async function inicializar() {
  carregarEstado();

  // v8.6: aplica volume/mute persistidos no Audio antes do primeiro som
  Audio.setVolume(State.volume);
  Audio.setMuted(State.mudo);
  atualizarControleSomUI();

  const loaderEl = $('#loader');
  const loaderBarra = $('#loader-barra');
  const loaderPular = $('#loader-pular');
  const loaderTexto = $('#loader-texto');

  let appJaIniciado = false;
  function fecharLoader() {
    if (appJaIniciado) return;
    appJaIniciado = true;
    if (rotacaoTextoId) clearInterval(rotacaoTextoId);
    loaderEl.classList.add('escondido');
    setTimeout(() => loaderEl && loaderEl.parentNode && loaderEl.remove(), 600);
    renderApp();
  }

  // v9.0: frases rotativas no loader. Refresca a cada 400ms; criança
  // não acha que travou. Ordem: tom afetivo → técnico → final.
  const FRASES_LOADER = [
    'preparando o sabiá…',
    'afinando o bico…',
    'pegando os lápis…',
    'quase lá…',
  ];
  let rotacaoTextoId = null;
  let fraseIdx = 0;
  rotacaoTextoId = setInterval(() => {
    if (!loaderTexto || appJaIniciado) return;
    fraseIdx = (fraseIdx + 1) % FRASES_LOADER.length;
    loaderTexto.style.opacity = '0';
    setTimeout(() => {
      if (loaderTexto) {
        loaderTexto.textContent = FRASES_LOADER[fraseIdx];
        loaderTexto.style.opacity = '1';
      }
    }, 220);
  }, 400);

  // Botão "pular →" desde 0.5s — usuário sai rápido se quiser.
  setTimeout(() => loaderPular.classList.add('visivel'), 500);
  loaderPular.addEventListener('click', fecharLoader);

  // App inicializa imediatamente: o sample real do sabiá está embedded inline.
  // WebAudioFont (violão) carrega em background, cai pra síntese silenciosamente se falhar.
  Audio.carregarSoundfonts(p => {
    loaderBarra.style.width = (p * 100) + '%';
  }).catch(() => {/* sem mensagem alarmista — violão usa síntese */});

  // Esconde loader em 1.2s — tempo pra ler "preparando" sem travar offline.
  setTimeout(fecharLoader, 1200);

  // Desbloqueio: cada gesto reabre o AudioContext (iOS suspende após inatividade).
  const unlockHandler = () => Audio.unlock();
  document.body.addEventListener('touchend', unlockHandler);
  document.body.addEventListener('click', unlockHandler);
}

window.addEventListener('load', inicializar);
</script>
